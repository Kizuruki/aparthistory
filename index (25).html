<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AP Art History Study Program</title>
<style>
:root{
  --green-dark:#0b1a0f;
  --green-mid:#173a22;
  --green:#2f6d3f;
  --green-bright:#5ad865;
  --green-light:#eafbea;
  --white:#ffffff;
  --ink:#1f2d22;
  --muted:#5b6b60;
  --danger:#c0392f;
  --danger-bg:#fdeceb;
  --success:#1f8a43;
  --success-bg:#e7f8ed;
  --radius:14px;
  --shadow:0 8px 24px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  background:
    radial-gradient(ellipse at top left, #1d4228 0%, transparent 55%),
    radial-gradient(ellipse at bottom right, #0f2716 0%, transparent 55%),
    linear-gradient(160deg,var(--green-dark),var(--green-mid) 55%,var(--green-dark));
  background-attachment:fixed;
  min-height:100vh;
  color:var(--ink);
  padding:20px 14px 60px;
}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit}
.hidden{display:none !important}

/* ---------- header ---------- */
.site-header{text-align:center;color:#fff;margin-bottom:22px}
.site-header h1{font-size:2.1rem;text-shadow:2px 2px 6px rgba(0,0,0,.35);letter-spacing:.3px}
.site-header p{opacity:.85;margin-top:6px;font-size:.98rem}
.top-nav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.top-nav button{
  background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35);
  padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;
  transition:all .18s ease;
}
.top-nav button:hover{background:rgba(255,255,255,.18)}
.top-nav button.active{background:var(--green-bright);color:#0b1a0f;border-color:var(--green-bright)}

/* ---------- buttons ---------- */
.btn{
  background:linear-gradient(135deg,#66ea67 0%,#2f9463 100%);
  color:#fff;border:none;padding:10px 18px;border-radius:9px;cursor:pointer;
  font-weight:700;font-size:.9rem;transition:transform .15s,box-shadow .15s;
  box-shadow:0 3px 10px rgba(60,150,80,.35);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(60,150,80,.45)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.secondary{background:linear-gradient(135deg,#8a97a8,#5a6675);box-shadow:0 3px 10px rgba(90,102,117,.3)}
.btn.outline{background:transparent;border:2px solid var(--green);color:var(--green);box-shadow:none;padding:8px 16px}
.btn.outline:hover{background:var(--green);color:#fff}
.btn.small{padding:6px 12px;font-size:.8rem;border-radius:7px}
.btn.block{width:100%}

/* ---------- cards / containers ---------- */
.panel{background:rgba(255,255,255,.97);border-radius:18px;box-shadow:var(--shadow);padding:24px}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px;margin-bottom:18px}
.unit-card{
  background:#fff;border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;border:2px solid transparent;transition:transform .15s,border-color .15s;
}
.unit-card:hover{transform:translateY(-3px);border-color:var(--green-bright)}
.unit-badge{
  display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--green-light);color:var(--green);font-weight:800;font-size:.95rem;
}
.unit-card h3{font-size:1.02rem;color:var(--ink);line-height:1.3;margin-top:2px}
.unit-card .meta{color:var(--muted);font-size:.82rem}
.unit-card .card-btns{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.all-card{background:linear-gradient(135deg,#e9fbee,#d9f5e0);border:2px solid var(--green-bright)}

/* ---------- quiz setup ---------- */
.setup-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.setup-row label{font-size:.85rem;color:var(--muted);font-weight:600;margin-right:4px}
.chip-group{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:7px 14px;border-radius:999px;border:2px solid #dfe7e1;background:#fff;cursor:pointer;
  font-size:.85rem;font-weight:600;color:var(--ink);transition:all .15s;
}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- quiz card ---------- */
.progress-bar-outer{background:#e5efe7;border-radius:999px;height:9px;overflow:hidden;margin-bottom:14px}
.progress-bar-inner{background:linear-gradient(90deg,var(--green-bright),var(--green));height:100%;transition:width .25s}
.quiz-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.quiz-top-row .score-pill{
  background:var(--green-light);color:var(--green);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.85rem;
}
.quiz-top-row .qcount{color:var(--muted);font-size:.85rem;font-weight:600}
.quiz-card{display:flex;gap:22px;flex-wrap:wrap}
.quiz-image-box{
  flex:0 0 280px;width:280px;height:280px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#eef4ef,#dfe9e1);
  display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 1px #e2e9e3;
}
.quiz-image-box img{width:100%;height:100%;object-fit:cover;display:block}
.img-fallback{text-align:center;color:var(--muted);padding:18px;font-size:.85rem;line-height:1.4}
.img-fallback .icon{font-size:2.2rem;display:block;margin-bottom:8px}
.spinner{width:34px;height:34px;border:4px solid #d7e4da;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.quiz-info{flex:1 1 320px;min-width:280px}
.quiz-info .tag{display:inline-block;background:var(--green-light);color:var(--green);font-size:.72rem;font-weight:700;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase}
.quiz-info h2{font-size:1.5rem;color:var(--ink);line-height:1.25;margin-bottom:14px}

.field-group{margin-bottom:14px}
.field-group label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.field-group input{
  width:100%;padding:10px 12px;border-radius:9px;border:2px solid #dfe7e1;font-size:.95rem;background:#fff;
  transition:border-color .15s;
}
.field-group input:focus{outline:none;border-color:var(--green-bright)}
.field-group.correct input{border-color:var(--success);background:var(--success-bg)}
.field-group.incorrect input{border-color:var(--danger);background:var(--danger-bg)}
.field-feedback{margin-top:6px;font-size:.82rem;display:none}
.field-feedback.show{display:block}
.field-feedback .fb-correct{color:var(--success);font-weight:700}
.field-feedback .fb-incorrect{color:var(--danger);font-weight:700}
.field-feedback .fb-answer{color:var(--ink);opacity:.85;margin-top:2px}
.field-feedback .override{margin-top:4px;font-size:.78rem;color:var(--muted);cursor:pointer;user-select:none}
.field-feedback .override input{width:auto;margin-right:5px}

.overall-banner{
  margin-top:6px;padding:12px 16px;border-radius:10px;font-weight:700;display:none;align-items:center;gap:8px;
}
.overall-banner.show{display:flex}
.overall-banner.correct{background:var(--success-bg);color:var(--success)}
.overall-banner.incorrect{background:var(--danger-bg);color:var(--danger)}
.quiz-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* ---------- results ---------- */
.results-score{text-align:center;padding:10px 0 20px}
.results-score .big{font-size:2.6rem;font-weight:800;color:var(--green)}
.results-score .sub{color:var(--muted);margin-top:4px}
.missed-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.missed-item{
  display:flex;gap:12px;align-items:center;background:#f7faf7;border-radius:10px;padding:10px 12px;
}
.missed-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:0 0 56px;background:#e5ece6}
.missed-item .txt{font-size:.85rem}
.missed-item .txt b{display:block;font-size:.92rem}
.missed-item .txt span{color:var(--muted)}

/* ---------- timeline ---------- */
.timeline-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.timeline-controls select{
  padding:9px 12px;border-radius:9px;border:2px solid #dfe7e1;font-size:.9rem;background:#fff;font-weight:600;
}
.timeline-scroll{overflow-x:auto;overflow-y:hidden;padding:30px 20px 26px;position:relative}
.timeline-axis{position:relative;height:2px;background:linear-gradient(90deg,var(--green-bright),var(--green));margin-top:14px}
.timeline-track{display:flex;align-items:flex-end;position:relative;min-height:230px}
.timeline-item{
  flex:0 0 128px;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;
  padding-bottom:14px;
}
.timeline-item .dot{width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 2px var(--green);margin:6px 0}
.timeline-thumb{
  width:96px;height:96px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#eef4ef,#dfe9e1);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
}
.timeline-thumb img{width:100%;height:100%;object-fit:cover}
.timeline-item .t-name{font-size:.72rem;text-align:center;margin-top:6px;color:#fff;font-weight:600;line-height:1.2;
  max-width:118px;text-shadow:1px 1px 3px rgba(0,0,0,.5)}
.timeline-item .t-date{font-size:.68rem;text-align:center;color:var(--green-bright);font-weight:700;margin-top:2px}
.timeline-item:hover .timeline-thumb{outline:3px solid var(--green-bright)}

/* detail modal */
#detailModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
#detailModal.show{display:flex}
.detail-box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:88vh;overflow:auto}
.detail-box img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:14px;background:#eef4ef}
.detail-box h3{font-size:1.25rem;margin-bottom:10px;color:var(--ink)}
.detail-row{margin-bottom:8px;font-size:.9rem}
.detail-row b{color:var(--green);display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.detail-close{margin-top:14px}

.section-title{color:#fff;text-align:center;margin:26px 0 14px;font-size:1.3rem;text-shadow:1px 1px 4px rgba(0,0,0,.3)}
.footer-note{text-align:center;color:rgba(255,255,255,.55);font-size:.78rem;margin-top:30px}

@media(max-width:640px){
  .quiz-card{flex-direction:column}
  .quiz-image-box{width:100%;height:220px}
}
</style>
</head>
<body>

<div id="detailModal">

</div>

const UNITS = (() => {
  const map = {};
  DATA.forEach(w => {

})();

/* ================= utilities ================= */
function stripAccents(s){ return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,''); }
function normalize(s){
  return stripAccents((s||'').toLowerCase())
    .replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
const STOPWORDS = new Set(['and','the','with','from','into','onto','their','this','that','were','are','was','for','has','have','over','under','also','early','late','mid','century','c','ce','bce','circa','probably']);
function significantWords(s){
  return normalize(s).split(' ').filter(w => w.length>=4 && !STOPWORDS.has(w));
}
function extractYears(s){
  const cleaned = (s||'').replace(/,/g,'');
  const m = cleaned.match(/\d+/g) || [];
  return m.map(Number);
}
function checkDateField(input, correct){
  if(!input.trim()) return false;
  const inY = extractYears(input), corY = extractYears(correct);
  if(inY.length && corY.length){
    for(const iy of inY) for(const cy of corY) if(Math.abs(iy-cy) <= 30) return true;
  }
  const a = significantWords(input), b = significantWords(correct);
  if(a.length && b.some(w => a.includes(w))) return true;
  return false;
}
function checkTextField(input, correct){
  const ni = normalize(input), nc = normalize(correct);
  if(!ni) return false;
  if(nc.includes(ni) || ni.includes(nc)) return true;
  const a = significantWords(input), b = significantWords(correct);
  return b.some(w => a.includes(w));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= image fetching (Wikipedia, client-side) ================= */
const imageCache = {}; // work.num -> url or null
function imageQuery(work){
  let base = work.name.replace(/\s*\([^)]*\)/g,'').replace(/\s*\[[^\]]*\]/g,'').trim();
  let extra = '';
  if(work.culture){
    extra = ' ' + work.culture.split(/[,;(]/)[0].trim();
  }
  return (base + extra).slice(0,120);
}
async function fetchImage(work){
  if(imageCache.hasOwnProperty(work.num)) return imageCache[work.num];
  const q = encodeURIComponent(imageQuery(work));
  const url = `https://en.wikipedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${q}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json`;
  try{
    const res = await fetch(url);
    const json = await res.json();
    const pages = json.query && json.query.pages;
    if(pages){
      const page = Object.values(pages)[0];
      if(page && page.thumbnail && page.thumbnail.source){
        imageCache[work.num] = page.thumbnail.source;
        return page.thumbnail.source;
      }
    }
    imageCache[work.num] = null;
    return null;
  }catch(e){
    imageCache[work.num] = null;
    return null;
  }
}
function loadImageInto(el, work){
  el.innerHTML = '<div class="spinner"></div>';
  fetchImage(work).then(url => {
    if(url){
      const img = document.createElement('img');
      img.src = url;
      img.alt = work.name;
      img.loading = 'lazy';
      img.onerror = () => {
        el.innerHTML = '<div class="img-fallback"><span class="icon">🖼️</span>No image found</div>';
      };
      el.innerHTML = '';
      el.appendChild(img);
    } else {
      el.innerHTML = '<div class="img-fallback"><span class="icon">🖼️</span>No image found</div>';
    }
  });
}
// lazy loader for timeline thumbnails using IntersectionObserver
let lazyObserver = null;
function getLazyObserver(){
  if(lazyObserver) return lazyObserver;
  lazyObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const el = entry.target;
        const num = parseInt(el.dataset.num, 10);
        const work = DATA.find(w => w.num === num);
        if(work) loadImageInto(el, work);
        lazyObserver.unobserve(el);
      }
    });
  }, {rootMargin:'200px'});
  return lazyObserver;
}

function renderQuizSetup(unitNum){
  const pool = unitNum === 0 ? DATA : DATA.find(()=>false) || UNITS.find(u=>u.unit===unitNum).works;
  const unitTitle = unitNum === 0 ? 'All Units' : `Unit ${unitNum}: ${UNITS.find(u=>u.unit===unitNum).title}`;
  const max = pool.length;
  let countOptions = [10,20,50].filter(n => n < max);
  countOptions.push(max);

  let html = `<div class="panel">
    <button class="btn outline small" id="backBtn" style="margin-bottom:14px">&larr; Back to units</button>
    <h2 style="color:var(--ink)">${escapeHtml(unitTitle)}</h2>

    <div class="setup-row">

      <div class="chip-group" id="countChips">

      </div>
    </div>

    <button class="btn" id="startQuizBtn" style="margin-top:8px">Start Studying &rarr;</button>
  </div>`;
  app.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', renderHome);

  let selectedCount = countOptions[countOptions.length-1];

      document.querySelectorAll('#countChips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');

    });
  });
  document.getElementById('startQuizBtn').addEventListener('click', () => {
    startQuizSession(unitNum, selectedCount);
  });

/* ================= QUIZ SESSION ================= */
let session = null;

function startQuizSession(unitNum, count){
  const pool = unitNum === 0 ? DATA : UNITS.find(u=>u.unit===unitNum).works;
  const questions = shuffle(pool).slice(0, count);
  session = {
    unitNum, questions, index:0,
    score:{correct:0,total:0}, missed:[],
    checked:false, fieldStates:{}
  };
  renderQuizQuestion();
}

function currentWork(){ return session.questions[session.index]; }

function renderQuizQuestion(){
  const w = currentWork();
  session.checked = false;
  session.fieldStates = {};

  const fields = [];
  if(w.culture) fields.push({key:'culture', label:'Culture / Period / Artist', value:w.culture});
  fields.push({key:'date', label:'Date', value:w.date});
  if(w.medium) fields.push({key:'medium', label:'Medium / Material', value:w.medium});

  const pct = Math.round((session.index / session.questions.length) * 100);

  let html = `<div class="panel">
    <div class="quiz-top-row">
      <button class="btn outline small" id="quitBtn">&larr; Exit</button>
      <div class="qcount">Question ${session.index+1} of ${session.questions.length}</div>
      <div class="score-pill">Score: ${session.score.correct}/${session.score.total}</div>
    </div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%"></div></div>

    <div class="quiz-card">
      <div class="quiz-image-box" id="quizImg"><div class="spinner"></div></div>
      <div class="quiz-info">
        <div class="tag">#${w.num} &middot; Unit ${w.unit}</div>
        <h2>${escapeHtml(w.name)}</h2>
        <div id="fieldsWrap">
        ${fields.map(f => `
          <div class="field-group" data-key="${f.key}">
            <label>${f.label}</label>
            <input type="text" placeholder="Type what you remember..." data-key="${f.key}" autocomplete="off">
            <div class="field-feedback" data-fb="${f.key}"></div>
          </div>`).join('')}
        </div>
        <div class="overall-banner" id="overallBanner"></div>
        <div class="quiz-actions">
          <button class="btn" id="checkBtn">Check Answer</button>
          <button class="btn secondary hidden" id="nextBtn">${session.index+1<session.questions.length ? 'Next Question &rarr;' : 'See Results &rarr;'}</button>
        </div>
      </div>
    </div>
  </div>`;
  app.innerHTML = html;

  loadImageInto(document.getElementById('quizImg'), w);
  document.getElementById('quitBtn').addEventListener('click', renderHome);
  document.getElementById('checkBtn').addEventListener('click', () => checkAnswer(fields));
  document.getElementById('nextBtn').addEventListener('click', () => advanceQuiz(fields));

  // allow Enter key to trigger check
  app.querySelectorAll('#fieldsWrap input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if(e.key==='Enter'){
        e.preventDefault();
        if(!session.checked) checkAnswer(fields); else advanceQuiz(fields);
      }
    });
  });
  app.querySelectorAll('#fieldsWrap input')[0] && app.querySelectorAll('#fieldsWrap input')[0].focus();
}

function checkAnswer(fields){
  session.checked = true;
  fields.forEach(f => {
    const input = document.querySelector(`input[data-key="${f.key}"]`);
    const group = document.querySelector(`.field-group[data-key="${f.key}"]`);
    const fb = document.querySelector(`[data-fb="${f.key}"]`);
    const val = input.value;
    const isCorrect = f.key==='date' ? checkDateField(val, f.value) : checkTextField(val, f.value);
    session.fieldStates[f.key] = isCorrect;
    input.disabled = true;
    group.classList.remove('correct','incorrect');
    group.classList.add(isCorrect ? 'correct' : 'incorrect');
    fb.classList.add('show');
    fb.innerHTML = `
      <div class="${isCorrect?'fb-correct':'fb-incorrect'}">${isCorrect ? '✓ Looks right' : '✗ Not quite'}</div>
      <div class="fb-answer">Answer: ${escapeHtml(f.value)}</div>
      <label class="override"><input type="checkbox" data-override="${f.key}" ${isCorrect?'checked':''}> I actually got this right</label>
    `;
  });

  app.querySelectorAll('[data-override]').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.dataset.override;
      session.fieldStates[key] = cb.checked;
      const group = document.querySelector(`.field-group[data-key="${key}"]`);
      group.classList.remove('correct','incorrect');
      group.classList.add(cb.checked ? 'correct' : 'incorrect');
      updateOverallBanner(fields);
    });
  });

  updateOverallBanner(fields);
  document.getElementById('checkBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtn').focus();
}

function updateOverallBanner(fields){
  const correctCount = fields.filter(f => session.fieldStates[f.key]).length;
  const required = Math.min(2, fields.length);
  const overallCorrect = correctCount >= required;
  const banner = document.getElementById('overallBanner');
  banner.classList.add('show');
  banner.classList.remove('correct','incorrect');
  banner.classList.add(overallCorrect ? 'correct' : 'incorrect');
  banner.innerHTML = overallCorrect
    ? `✓ Correct! (${correctCount}/${fields.length} identifiers, needed ${required})`
    : `✗ Marked incorrect (${correctCount}/${fields.length} identifiers, needed ${required})`;
  session._overallCorrect = overallCorrect;
}

function advanceQuiz(fields){
  const w = currentWork();
  session.score.total++;
  if(session._overallCorrect) session.score.correct++;
  else session.missed.push(w);

  session.index++;
  if(session.index < session.questions.length){
    renderQuizQuestion();
  } else {
    renderResults();
  }
}

function renderResults(){
  const pct = session.score.total ? Math.round((session.score.correct/session.score.total)*100) : 0;
  let html = `<div class="panel">
    <div class="results-score">
      <div class="big">${session.score.correct} / ${session.score.total}</div>
      <div class="sub">${pct}% correct</div>
    </div>`;
  if(session.missed.length){
    html += `<h3 style="color:var(--ink);margin-bottom:6px">Review these ${session.missed.length}:</h3>
    <div class="missed-list" id="missedList">`;
    session.missed.forEach(w => {
      html += `<div class="missed-item" data-num="${w.num}">
        <img data-num="${w.num}" alt="">
        <div class="txt"><b>${escapeHtml(w.name)}</b>
          <span>${escapeHtml(w.culture||'—')} &middot; ${escapeHtml(w.date)} &middot; ${escapeHtml(w.medium||'—')}</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<p style="text-align:center;color:var(--muted)">Perfect run — nothing to review! 🎉</p>`;
  }
  html += `<div class="quiz-actions" style="margin-top:18px">
      ${session.missed.length ? '<button class="btn" id="redoMissed">Redo Missed Works</button>' : ''}
      <button class="btn secondary" id="restartSame">Restart This Set</button>
      <button class="btn outline" id="backHome">Back to Units</button>
    </div>
  </div>`;
  app.innerHTML = html;

  session.missed.forEach(w => {
    const img = document.querySelector(`.missed-item[data-num="${w.num}"] img`);
    fetchImage(w).then(url => {
      if(url){ img.src = url; img.onerror = () => { img.style.visibility='hidden'; }; }
      else { img.style.visibility='hidden'; }
    });
  });

  document.getElementById('backHome').addEventListener('click', renderHome);
  document.getElementById('restartSame').addEventListener('click', () => {
    startQuizSession(session.unitNum, session.questions.length);
  });
  const redoBtn = document.getElementById('redoMissed');
  if(redoBtn){
    redoBtn.addEventListener('click', () => {
      const missed = session.missed;
      session = { unitNum: session.unitNum, questions: shuffle(missed), index:0,
        score:{correct:0,total:0}, missed:[], checked:false, fieldStates:{} };
      renderQuizQuestion();
    });
  }
}

/* ================= TIMELINE ================= */
function renderTimeline(unitNum){
  const unitOptionsHtml = `<option value="0">All Units (${DATA.length} works)</option>` +
    UNITS.map(u => `<option value="${u.unit}">Unit ${u.unit}: ${escapeHtml(u.title)} (${u.works.length})</option>`).join('');

  let html = `<div class="panel">
    <h2 style="color:var(--ink);margin-bottom:4px">Chronological Timeline</h2>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:14px">Works are arranged in true chronological order (evenly spaced) so you can see how cultures across the world relate in time. Click any work for details.</p>
    <div class="timeline-controls">
      <select id="timelineUnitSelect">${unitOptionsHtml}</select>
    </div>
    <div class="timeline-scroll">
      <div class="timeline-track" id="timelineTrack"></div>
      <div class="timeline-axis"></div>
    </div>
  </div>`;
  app.innerHTML = html;

  const select = document.getElementById('timelineUnitSelect');
  select.value = String(unitNum);
  select.addEventListener('change', () => drawTimeline(parseInt(select.value,10)));
  drawTimeline(unitNum);
}

function drawTimeline(unitNum){
  const pool = unitNum === 0 ? DATA : UNITS.find(u=>u.unit===unitNum).works;
  const sorted = pool.slice().sort((a,b) => a.sortYear - b.sortYear);
  const track = document.getElementById('timelineTrack');
  track.innerHTML = sorted.map(w => `
    <div class="timeline-item" data-num="${w.num}">
      <div class="timeline-thumb" data-num="${w.num}"><div class="spinner"></div></div>
      <div class="dot"></div>
      <div class="t-name">${escapeHtml(w.name)}</div>
      <div class="t-date">${escapeHtml(formatShortDate(w))}</div>
    </div>
  `).join('');

  const obs = getLazyObserver();
  track.querySelectorAll('.timeline-thumb').forEach(el => obs.observe(el));
  track.querySelectorAll('.timeline-item').forEach(el => {
    el.addEventListener('click', () => openDetail(parseInt(el.dataset.num,10)));
  });
}

function formatShortDate(w){
  const y = w.sortYear;
  if(y < 0) return Math.abs(Math.round(y)).toLocaleString() + ' BCE';
  return Math.round(y).toLocaleString() + ' CE';
}

function openDetail(num){
  const w = DATA.find(x => x.num === num);
  const modal = document.getElementById('detailModal');
  const box = document.getElementById('detailBox');
  box.innerHTML = `
    <div id="detailImg"><div class="spinner" style="margin:40px auto"></div></div>
    <h3>${escapeHtml(w.name)}</h3>
    <div class="detail-row"><b>Number / Unit</b>#${w.num} &middot; Unit ${w.unit}: ${escapeHtml(w.unitTitle)}</div>
    ${w.culture ? `<div class="detail-row"><b>Culture / Period / Artist</b>${escapeHtml(w.culture)}</div>` : ''}
    <div class="detail-row"><b>Date</b>${escapeHtml(w.date)}</div>
    ${w.medium ? `<div class="detail-row"><b>Medium</b>${escapeHtml(w.medium)}</div>` : ''}
    <button class="btn outline detail-close" id="closeDetail">Close</button>
  `;
  modal.classList.add('show');
  document.getElementById('closeDetail').addEventListener('click', () => modal.classList.remove('show'));
  fetchImage(w).then(url => {
    const imgWrap = document.getElementById('detailImg');
    if(!imgWrap) return;
    if(url){
      const img = document.createElement('img');
      img.src = url;
      img.alt = w.name;
      img.onerror = () => { imgWrap.innerHTML = ''; };
      imgWrap.innerHTML = '';
      imgWrap.appendChild(img);
    } else {
      imgWrap.innerHTML = '';
    }
  });
}
document.getElementById('detailModal').addEventListener('click', (e) => {
  if(e.target.id === 'detailModal') e.currentTarget.classList.remove('show');
});

/* ================= init ================= */
renderHome();
</script>
</body>
</html>
